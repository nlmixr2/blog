title: nlmixr2 reveal.js theme
author: nlmixr2 development team
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    revealjs:
      # 13.333in x 7.5in (16:9), matching the PowerPoint template
      width: 1280
      height: 720
      # reveal insets the slide by margin/2 on each side, which puts the
      # content edge at 5% -- the same 623392/12192000 EMU inset the master
      # uses for the title and body placeholders.
      margin: 0.1
      theme:
        - default
        - nlmixr2-logos.scss
        - nlmixr2.scss
      # The master slide shows a bare slide number (bottom left, red)
      slide-number: c
      show-slide-number: all
      footer: "nlmixr2 development team"
      center: false
      # the deck has no progress bar
      progress: false
      # The PowerPoint code blocks are monochrome Courier New.
      # Set `highlight-style: arrow` (or any other) in your document to
      # get syntax colouring back.
      highlight-style: none
      code-block-height: 650px
      link-external-newwindow: true
      fig-align: center
