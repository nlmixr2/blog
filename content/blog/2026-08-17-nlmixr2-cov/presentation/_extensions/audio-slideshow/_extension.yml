title: Audio Slideshow
author: Asvin Goel
version: 1.0.0
quarto-required: ">=1.3.0"
# Vendored from https://github.com/rajgoel/reveal.js-plugins/tree/master/audio-slideshow
# (audio-slideshow/plugin.js, MIT).  Quarto generates Reveal.initialize() itself,
# so a reveal plugin has to arrive as an extension like this one rather than as
# a hand-edited config block.
contributes:
  revealjs-plugins:
    - name: RevealAudioSlideshow
      script:
        - plugin.js
      config:
        audio:
          # The plugin builds each filename as prefix + indexh + "." + indexv +
          # suffix, so slide 1 (h=0, v=0) is audio/slide0.0.mp3.  The clips are
          # named to match; do NOT renumber them to slide1.mp3 etc. or nothing
          # will be found.
          prefix: "audio/slide"
          suffix: ".mp3"
          # start playing as soon as the deck opens
          autoplay: true
          # 0 = advance to the next slide the moment the clip ends
          # (a negative value would disable auto-advance)
          advance: 0
          # every slide has its own clip, so never fall back to text-to-speech
          defaultNotes: false
          defaultText: false
          defaultAudios: true
          playerOpacity: 0.05
